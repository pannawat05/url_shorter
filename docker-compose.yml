services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    image: url_shorter_backend
    container_name: urlshort-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - appnet

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    image: url_shorter_frontend
    container_name: urlshort-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge