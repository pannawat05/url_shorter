version: "3.9"

services:
  backend:
    build: ./backend
    container_name: urlshort-backend
    restart: always
    env_file:
      - ./back-end/.env
    ports:
      - "3000:3000"
    networks:
      - urlshort-net

  frontend:
    build: ./front-end
    container_name: urlshort-frontend
    restart: always
    env_file:
      - ./front-end/.env
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - urlshort-net

networks:
  urlshort-net:
    driver: bridge
